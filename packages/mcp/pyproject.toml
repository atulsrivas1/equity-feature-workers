[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "equity-feature-mcp"
version = "0.1.0a0"
description = "Experimental local bounded MCP tools over the public remote client"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{name = "Equity Features contributors"}]
dependencies = ["equity-feature-client==0.1.0a0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
equity_feature_mcp = ["py.typed", "schemas/*.json"]

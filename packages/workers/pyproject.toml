[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "equity-feature-workers"
version = "0.1.0a0"
description = "Typed experimental equity component foundation"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{name = "Equity Features contributors"}]
dependencies = ["equity-feature-io-sdk==0.1.0a0"]

[project.urls]
Repository = "https://github.com/atulsrivas1/equity-feature-workers"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
equity_feature_workers = ["py.typed"]

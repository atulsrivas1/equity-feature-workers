[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "equity-feature-provenance"
version = "0.1.0a5"
description = "Explicit outer supplied provenance and native generation readback"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{name = "Equity Features contributors"}]
dependencies = ["equity-feature-contracts==0.0.4a6", "equity-feature-evidence==0.1.0a4", "equity-feature-workers==0.1.0a18", "equity-feature-io-contracts==0.1.0a5", "equity-feature-io-sdk==0.1.0a3", "equity-feature-duckdb==0.1.0a12", "equity-feature-duckdb-sink==0.1.0a1"]

[project.urls]
Repository = "https://github.com/atulsrivas1/equity-feature-workers"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
equity_feature_provenance = ["py.typed"]

name: Typed foundation checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  foundation:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: component
      - uses: actions/checkout@v4
        with:
          repository: atulsrivas1/equity-features
          ref: 20c08c7370581d03c8a0404579667f68d67ac88b
          path: core
      - uses: actions/checkout@v4
        with:
          repository: atulsrivas1/equity-feature-io
          ref: 19aa266b9debb92a6c5eb707baafeb9ae7a82942
          path: io
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-dev.txt
        working-directory: component
      - run: python -m pip install --no-deps ../core/packages/contracts ../core/packages/features ../io/packages/io-contracts ../io/packages/io-sdk ../io/packages/acquisition ../io/packages/files ../io/packages/duckdb ../io/packages/parquet ../io/packages/duckdb-sink ../io/examples/third_party ./packages/workers
        working-directory: component
      - run: python -m unittest discover -s tests -p test_*.py
        working-directory: component
      - run: python tools/build_foundation.py --core-root ../core --io-root ../io
        working-directory: component
      - uses: actions/upload-artifact@v4
        with:
          name: foundation-${{ github.sha }}-${{ matrix.os }}
          path: component/dist/
          retention-days: 30
          if-no-files-found: error

name: Synthetic agent research qualification
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  agent-research:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: component
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/checkout@v4
        with:
          repository: atulsrivas1/equity-features
          ref: d2ac11ebca5fe2cd151c35fa7f889a1d70a61d6d
          path: core
          fetch-depth: 0
      - uses: actions/checkout@v4
        with:
          repository: atulsrivas1/equity-feature-io
          ref: 18d86761aa3eebb7414e51e8fa2aba089717b5eb
          path: io
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.10'
      - run: python -m pip install -r requirements-dev.txt -r tools/requirements-service.txt
        working-directory: component
      - run: python tools/build_agent_research.py --core-root ../core --io-root ../io
        working-directory: component
      - uses: actions/upload-artifact@v4
        with:
          name: agent-research-${{ github.event.pull_request.head.sha || github.sha }}-${{ matrix.os }}
          path: component/dist/agent-research/
          retention-days: 30
          if-no-files-found: error

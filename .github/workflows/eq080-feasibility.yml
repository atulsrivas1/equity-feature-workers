name: EQ080 pre-code OS feasibility
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  host-probe:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -I tools/probe_eq080_host.py

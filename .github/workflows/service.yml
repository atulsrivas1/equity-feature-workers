name: Optional service qualification
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  service:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: component
          fetch-depth: 0
      - uses: actions/checkout@v4
        with:
          repository: atulsrivas1/equity-features
          ref: 20c08c7370581d03c8a0404579667f68d67ac88b
          path: core
      - uses: actions/checkout@v4
        with:
          repository: atulsrivas1/equity-feature-io
          ref: 19aa266b9debb92a6c5eb707baafeb9ae7a82942
          path: io
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-dev.txt -r tools/requirements-service.txt
        working-directory: component
      - run: python tools/build_service.py --core-root ../core --io-root ../io
        working-directory: component
      - uses: actions/upload-artifact@v4
        with:
          name: service-${{ github.sha }}-${{ matrix.os }}
          path: component/dist/service/
          retention-days: 30
          if-no-files-found: error

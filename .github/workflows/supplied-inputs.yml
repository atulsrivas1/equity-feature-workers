name: Supplied input package checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  supplied-inputs:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: component
      - uses: actions/checkout@v4
        with:
          repository: atulsrivas1/equity-features
          ref: 37ac44a3d0406231caf481c44f4ccce70fb2aba0
          path: core
      - uses: actions/checkout@v4
        with:
          repository: atulsrivas1/equity-feature-io
          ref: 89bc3d0d61cda5e8b1f5056b500c1f660a051045
          path: io
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-dev.txt
        working-directory: component
      - run: python tools/build_supplied_inputs.py --core-root ../core --io-root ../io
        working-directory: component
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: supplied-inputs-${{ github.sha }}-${{ matrix.os }}
          path: component/dist/supplied-inputs/
          retention-days: 30
          if-no-files-found: error
